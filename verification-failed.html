<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Failed - iConnect</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-icon {
            font-size: 3rem;
            color: var(--error);
            margin-bottom: 20px;
        }
        .error-container {
            text-align: center;
            padding: 40px 20px;
        }
        .error-container h2 {
            color: var(--error);
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        .error-container p {
            color: var(--text-secondary);
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .error-btn {
            background: var(--primary);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        .error-btn:hover {
            background: var(--primary-hover);
        }
        .action-links {
            margin-top: 25px;
        }
        .action-links a {
            color: var(--primary);
            text-decoration: none;
            margin: 0 10px;
            font-weight: 500;
        }
        .action-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-wrapper">
            <div class="form-panel">
                <div class="form-container error-container">
                    <div class="error-icon">✗</div>
                    <h2>Verification Failed</h2>
                    <p>The verification link is invalid or has expired.</p>
                    <p>Please request a new verification email to continue.</p>
                    
                    <div class="action-links">
                        <a href="login.html">Return to Login</a>
                        <a href="#" id="resend-verification">Resend Verification Email</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('resend-verification').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Please sign in to your account and request a new verification email from your profile settings.');
        });
    </script>
</body>
</html>
