<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code - iConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-wrapper">
            <div class="form-panel">
                <div class="form-container">
                    <div class="form-header">
                        <div class="logo">
                            <img src="images/nkosi-it-logo.jpg" alt="iConnect" class="logo-image">
                            <span class="logo-text">iConnect</span>
                        </div>
                        <h2>Verify Your Email</h2>
                        <p>Enter the 6-digit code sent to your email</p>
                    </div>

                    <form id="code-verification-form" class="auth-form active">
                        <div class="input-group">
                            <label for="verification-code">6-Digit Code</label>
                            <input type="text" id="verification-code" placeholder="Enter 6-digit code" maxlength="6" required>
                            <div class="error-message"></div>
                        </div>

                        <button type="submit" class="submit-btn">
                            <span class="btn-text">Verify Code</span>
                            <div class="btn-loader" style="display: none;">
                                <div class="spinner"></div>
                            </div>
                        </button>

                        <p class="switch-form">
                            <a href="login.html">Back to Login</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="code-verification.js"></script>
</body>
</html>
